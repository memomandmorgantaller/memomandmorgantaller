name: Registry validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: baseline/rfp_registry_m1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baseline/rfp_registry_m1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip install ruff==0.17.1 mypy==2.4.0
      - run: ruff check rfp_registry tests examples
      - run: ruff format --check rfp_registry tests examples
      - run: mypy rfp_registry
