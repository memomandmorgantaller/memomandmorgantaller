name: Registry validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: baseline/rfp_registry_m1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Report test failures
        if: failure()
        run: python ci/report_test_failures.py test-results.xml
  static:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: baseline/rfp_registry_m1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip install ruff==0.17.1 mypy==2.4.0
      - run: ruff check rfp_registry tests examples ci
      - run: ruff format --check rfp_registry tests examples ci
      - run: mypy rfp_registry ci
