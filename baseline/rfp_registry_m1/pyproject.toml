[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-document-registry"
version = "0.2.0"
description = "Local, auditable RFP package intake and safe ZIP decomposition"
requires-python = ">=3.12"
dependencies = ["pypdf==6.21.0", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
rfp-registry = "rfp_registry.cli:main"

[tool.setuptools.packages.find]
include = ["rfp_registry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Limits"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
